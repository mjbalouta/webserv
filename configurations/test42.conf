server {
    root www;
    listen localhost:9090;
    server_name localhost;
    client_max_body_size 200M;
    error_page 400 /html/error_pages/default.html;
	error_page 403 /html/error_pages/default.html;
	error_page 404 /html/error_pages/default.html;
	error_page 405 /html/error_pages/default.html;
	error_page 413 /html/error_pages/default.html;
	error_page 500 /html/error_pages/default.html;
	error_page 502 /html/error_pages/default.html;
	error_page 504 /html/error_pages/default.html;

    location / {
        allow_methods GET;
        autoindex off;
    	index index.html;
    }

    location /post_body {
        allow_methods POST GET DELETE;
        client_max_body_size 100;
    }

    location /upload {
		autoindex off;
        allow_methods GET POST DELETE;
        upload_store www/upload;
    }

    location /directory {
        allow_methods GET POST;
        alias YoupiBanane;
        autoindex off;
        index youpi.bad_extension;
        cgi_pass .bla ./cgi_tester;
    }
}