server {
    root www;
    listen localhost:8080;
    listen localhost:8081;
	listen localhost:8082;
    server_name example.com;
    index index.html;
    client_max_body_size 10M;
    error_page 400 /html/error_pages/default.html;
	error_page 403 /html/error_pages/default.html;
	error_page 404 /html/error_pages/default.html;
	error_page 405 /html/error_pages/default.html;
	error_page 413 /html/error_pages/default.html;
	error_page 500 /html/error_pages/default.html;
	error_page 502 /html/error_pages/default.html;
	error_page 504 /html/error_pages/default.html;
	autoindex on;

	# !!better to be commented in order to test the GET in the index.html!!
    # location / {
    #     autoindex on;
	# 	index index.html;
    #     allow_methods GET POST DELETE;
    # }

    location /upload {
		autoindex off;
        allow_methods GET POST DELETE;
        upload_store www/upload;
    }

    location /cgi-bin {
        allow_methods GET POST;
        alias www/cgi-bin;
        cgi_pass .py /usr/bin/python3;
        # cgi_pass .php /usr/bin/php-cgi;
    }
}