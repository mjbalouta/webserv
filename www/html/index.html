<!DOCTYPE html>
<html lang="pt">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Webserv</title>
	<link rel="stylesheet" href="style.css">
	<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-darkbg text-gray-200 font-googlesans min-h-screen flex flex-col items-center overflow-x-hidden">

    <h1 class="font-bitcount text-[clamp(5rem,6rem+3vw,12rem)] font-[350] text-techpurple mt-24 mb-0 leading-none tracking-tight uppercase">
        WEBSERVER
    </h1>

	<!-- MENU -->
    <nav class="mt-3 space-x-6">
        <a href="#team" class="text-gray-600 px-4 py-2 rounded-full hover:text-gray-400 hover:shadow-[0_0_15px_rgba(100,20,120,0.5)] transition-all duration-150 py-2">Our Team</a>
        <a href="#server-info" class="text-gray-600 px-4 py-2 rounded-full hover:text-gray-400 hover:shadow-[0_0_15px_rgba(100,20,120,0.5)] transition-all duration-150 py-2">Server Info</a>
        <a href="#method-testing" class="text-gray-600 px-4 py-2 rounded-full hover:text-gray-400 hover:shadow-[0_0_15px_rgba(100,20,120,0.5)] transition-all duration-150 py-2">Method Testing</a>
        <a href="#gallery" class="text-gray-600 px-4 py-2 rounded-full hover:text-gray-400 hover:shadow-[0_0_15px_rgba(100,20,120,0.5)] transition-all duration-150 py-2">File Gallery</a>
    </nav>

    <main class="mt-12 w-[95%] md:w-[90%] max-w-3xl bg-black-900/15 backdrop-blur-md rounded-2xl p-8 shadow-[0_0_15px_rgba(100,20,120,0.5)]">
        
		<!-- OUR TEAM SECTION -->
		<div class="flex justify-center space-x-6">
            <a class="w-[30%]" href="https://github.com/DanielFonsecaa"><img class="rounded-full grayscale brightness-90" src="/images/dda-fons.jpeg"></a>
            <a class="w-[30%]" href="https://github.com/NukyYuki"><img class="rounded-full grayscale brightness-90" src="/images/mipinhei.png" alt="@mipinhei"></a>
            <a class="w-[30%]" href="https://github.com/mjbalouta"><img class="rounded-full grayscale" src="/images/mjoao-fr.jpeg" alt="@mjoao-fr"></a>
        </div>

		<!-- SERVER INFO SECTION -->
        <div>
            <p class="text-[16px] mt-3 mb-2 text-purple-900">Network Configuration</p>
			<ul class="mt-0 whitespace-pre-line text-gray-600">{{SERVER_DETAILS}}</ul>
        </div>
        <div></div>
    </main>

	<div class="w-full flex flex-wrap justify-center gap-6 px-4">
		<!-- GET TEST SECTION -->
		<div class="w-full md:w-[48%] mb-6 mt-12 max-w-3xl bg-black-900/15 backdrop-blur-md rounded-2xl p-8 shadow-[0_0_15px_rgba(100,20,120,0.5)]">
			<h3 class="mt-2 mb-6 text-purple-900 uppercase">GET Request Test:</h3>
			<div class="flex justify-center">
				<form class="mb-2 flex" action="/index.html" method="GET">
					<input class="text-purple-900 px-4 py-2 rounded-2xl" type="text" name="path" placeholder="Enter a location path">
					   <button class="ml-3 text-gray-600 px-4 py-2 rounded-full shadow-[0_0_15px_rgba(100,20,120,0.5)] hover:shadow-[0_0_8px_rgba(100,20,120,0.80)]" type="submit">Search Info</button>
				</form>
			</div>
			<div class="">
				<p class="text-[16px] mb-1 mt-8 text-purple-900">Request: </p>
				<ul id="request-details" class="text-[16px] whitespace-pre-line break-words text-gray-600">{{REQUEST_DETAILS}}</ul>
			</div>
			<div>
				<p class="text-[16px] mb-1 mt-6 text-purple-900">Location's Info: </p>
				<ul id="location-details" class="text-[16px] whitespace-pre-line break-words text-gray-600">{{LOCATION_DETAILS}}</ul>
			</div>
		</div>

		<!-- POST TEST SECTION-->
		<div class="w-full md:w-[48%] mb-6 mt-12 max-w-3xl bg-black-900/15 backdrop-blur-md rounded-2xl p-8 shadow-[0_0_15px_rgba(100,20,120,0.5)]">
			<h3 class="mt-2 mb-6 text-purple-900 uppercase">POST Request Test:</h3>
		</div>
	</div>

    <footer class="mb-8 text-gray-600">
        <p>developed by 
            <a href="https://github.com/DanielFonsecaa" class="hover:text-purple-900 transition-colors">@dda-fons</a>,
            <a href="https://github.com/NukyYuki" class="hover:text-purple-900 transition-colors">@mipinhei</a>,
            <a href="https://github.com/mjbalouta" class="hover:text-purple-900 transition-colors">@mjoao-fr</a>.
        </p>
    </footer>

</body>
</html>
